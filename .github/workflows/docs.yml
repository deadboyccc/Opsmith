# Builds the documentation site and publishes it to GitHub Pages.
#
# Every pull request builds the site strictly (a broken link, anchor or page fails it); a push
# to main also deploys it. The site is assembled from the repository's own Markdown by
# scripts/build_site.py, so the changelog and every guide on it are always those of main.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false # never interrupt a deployment half-way

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --only-group docs
      - run: uv run --frozen --only-group docs python scripts/build_site.py --build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site

  deploy:
    name: publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must be switched on once, by a repository admin (Settings, Pages, Source:
      # GitHub Actions). Until then the site is still built and checked above, and this job
      # says so instead of failing.
      - id: pages
        name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::The site was built but not published. Enable Pages (Settings > Pages > Source: GitHub Actions) and run this workflow again."
          fi
      - id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
