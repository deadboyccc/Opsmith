name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - name: Configure git identity for test repositories
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy
      - run: uv run python scripts/check_docs.py
      # Fails below the floor in pyproject.toml ([tool.coverage.report] fail_under).
      - run: uv run pytest -q --cov --cov-report=term

  audit:
    # Known vulnerabilities in any locked dependency, extras included. Runs on every push,
    # so a newly published advisory turns the next build red.
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.5"
          python-version: "3.12"
      - run: make audit

  postgres:
    name: full suite on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: opsmith
          POSTGRES_PASSWORD: opsmith
          POSTGRES_DB: opsmith
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsmith" --health-interval 5s --health-timeout 3s
          --health-retries 20
    env:
      # Every test gets its own freshly created database (see tests/conftest.py).
      OPSMITH_TEST_DATABASE_URL: postgresql+psycopg://opsmith:opsmith@localhost:5432/opsmith
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: uv sync --frozen --all-extras
      - run: uv run pytest -q

  connectors:
    # The compatibility matrix in docs/guide/compatibility.md. Each entry starts one real
    # server and runs tests/test_connectors_live.py against it.
    name: ${{ matrix.server }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: loki, version: "2.9.17", image: "grafana/loki", port: 3100, ready: "/ready" }
          - { server: loki, version: "3.7.10", image: "grafana/loki", port: 3100, ready: "/ready" }
          - { server: prometheus, version: "v2.53.5", image: "prom/prometheus", port: 9090, ready: "/-/ready" }
          - { server: prometheus, version: "v3.5.5", image: "prom/prometheus", port: 9090, ready: "/-/ready" }
          - { server: prometheus, version: "v3.16.0", image: "prom/prometheus", port: 9090, ready: "/-/ready" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.9.5"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Start ${{ matrix.server }} ${{ matrix.version }}
        run: |
          docker run -d --name server -p "127.0.0.1:${{ matrix.port }}:${{ matrix.port }}" \
            "${{ matrix.image }}:${{ matrix.version }}"
          for _ in $(seq 1 90); do
            curl -sf "http://127.0.0.1:${{ matrix.port }}${{ matrix.ready }}" && exit 0
            sleep 2
          done
          docker logs server
          exit 1
      - name: Live connector tests
        env:
          SERVER: ${{ matrix.server }}
          URL: http://127.0.0.1:${{ matrix.port }}
        run: |
          if [ "$SERVER" = loki ]; then export OPSMITH_TEST_LOKI_URL="$URL"; fi
          if [ "$SERVER" = prometheus ]; then export OPSMITH_TEST_PROMETHEUS_URL="$URL"; fi
          uv run pytest tests/test_connectors_live.py -k "$SERVER" -v -rA

  docker:
    name: container image and compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build --target runtime -t opsmith:ci .
      - run: docker build --target dev -t opsmith-dev:ci .
      - run: docker run --rm opsmith-dev:ci pytest -q -x
      - name: Compose refuses to start without a database password
        run: |
          if POSTGRES_PASSWORD= docker compose config -q 2>/dev/null; then
            echo "docker-compose.yml accepted an empty POSTGRES_PASSWORD" >&2
            exit 1
          fi
      - name: Compose files are valid
        run: |
          POSTGRES_PASSWORD=ci docker compose config -q
          POSTGRES_PASSWORD=ci DOCKER_GID=999 OPSMITH_WORK_DIR=/var/lib/opsmith/work \
            docker compose -f docker-compose.yml -f docker-compose.sandbox.yml config -q
