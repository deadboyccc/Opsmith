name: Bug report
description: Something does not work the way the documentation says.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this.

        **A security problem?** Please do not report it here. See [SECURITY.md](https://github.com/deadboyccc/Opsmith/blob/main/SECURITY.md) for how to report it privately.

        Before you paste logs or configuration, remove secrets, tokens and personal data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The commands, configuration (`opsmith.toml`) and input that trigger it. The smaller, the better.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Opsmith version
      description: The output of `opsmith --version`.
      placeholder: opsmith 1.5.1
    validations:
      required: true
  - type: dropdown
    id: how-run
    attributes:
      label: How you run it
      options:
        - opsmith demo
        - opsmith run (one process)
        - Docker Compose
        - Other
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Model provider and database
      description: For example "heuristic, SQLite" or "openai-compatible (Ollama, qwen2.5-coder), PostgreSQL 18".
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines, if any. They are shown as code.
      render: text
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you submit
      options:
        - label: I removed secrets, tokens and personal data from everything above.
          required: true
