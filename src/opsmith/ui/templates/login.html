{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Sign in</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ base }}/ui/login">
    <label class="label" for="k">API key</label>
    <input id="k" type="password" name="api_key" autocomplete="off" required>
    <p><button type="submit">Sign in</button></p>
  </form>
  <p class="muted">Create keys with <code>opsmith create-user</code>.</p>
</div>
{% endblock %}
