# Alembic configuration for writing schema migrations. See docs/development/architecture.md.
#
# Opsmith applies migrations itself when a process starts; this file is only for the
# `alembic` command, which connects to OPSMITH_DATABASE_URL (see src/opsmith/migrations/env.py).
[alembic]
script_location = %(here)s/src/opsmith/migrations
file_template = %%(rev)s_%%(slug)s
