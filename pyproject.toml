[project]
name = "opsmith"
version = "0.1.0"
description = "Autonomous engineering ops platform: observe -> analyze -> propose -> human approve -> execute -> PR."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "deadboyccc", email = "ahmed.mohammed.ali9999@gmail.com" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.8",
  "jinja2>=3.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=2.0"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
opsmith = "opsmith.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "e2e: end-to-end pipeline tests (slower, use git)",
  "docker: runs real containers; skipped automatically when Docker is unavailable",
]
filterwarnings = ["error::DeprecationWarning:opsmith.*"]

[tool.coverage.run]
source = ["opsmith"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "C4", "PT", "TID"]
ignore = [
  "PLR0913", # many args is normal for service constructors
  "PLR2004", # magic values in scoring heuristics are documented inline
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "S603",    # subprocess without shell is the sandbox's whole job
  "S607",    # git is resolved from PATH on purpose
  "RUF012",
  "PLR0917", # positional args on small internal helpers/dataclass-style constructors
  "S101",    # asserts narrow types for internal invariants only; security gates raise explicitly
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
packages = ["opsmith"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true
